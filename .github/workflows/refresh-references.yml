name: Refresh references

# Weekly: rebuild the GENERATED references from SailPoint's public repos, run the tests,
# and open a pull request only when something changed. No secrets needed.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SailPoint sources
        run: |
          git clone --depth 1 https://github.com/sailpoint-oss/api-specs.git /tmp/api-specs
          git clone --depth 1 --filter=blob:none --sparse https://github.com/sailpoint-oss/developer.sailpoint.com.git /tmp/dev-docs
          git -C /tmp/dev-docs sparse-checkout set docs
      - name: Rebuild
        run: python3 tools/build_references.py --specs /tmp/api-specs --docs /tmp/dev-docs
      - name: Ignore date-only changes
        run: |
          # every generated file carries the build date in its banner; drop files whose only change is that line
          for f in $(git diff --name-only); do
            if [ -z "$(git diff -U0 "$f" | grep '^[+-]' | grep -v '^+++\|^---' | grep -v 'GENERATED by tools/build_references.py\|"_generated"')" ]; then
              git checkout -- "$f"
            fi
          done
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-references
          commit-message: "chore: refresh references from SailPoint sources"
          title: "chore: refresh references from SailPoint sources"
          body: |
            Automated weekly rebuild from sailpoint-oss/api-specs and sailpoint-oss/developer.sailpoint.com.
            Review the diff (new endpoints, changed filters, new triggers/transform types) and update the hand-written references if needed.
          delete-branch: true
